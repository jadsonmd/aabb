# Sistema AABB - organizador de pelada
# Copie .env.example para .env e preencha os valores. Depois:
#   - com as imagens publicadas no Docker Hub (ex: Raspberry Pi): docker compose -p aabb pull && docker compose -p aabb up -d
#   - compilando a partir do código:                               docker compose -p aabb up -d --build

services:
  aabb-mongodb:
    image: mongo:8.0
    container_name: aabb-mongodb
    restart: unless-stopped
    # Replica set de um nó: necessário para transações (registro de resultado e aprovação de gols).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - aabb-mongodb-data:/data/db
    healthcheck:
      # Inicia o replica set na primeira subida e depois só confirma que ele está de pé.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'aabb-mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 10
    networks:
      - aabb-network

  # Postgres compartilhado: banco "evolution" (Evolution API) e banco "keycloak".
  aabb-postgres:
    build: ./infra/postgres
    image: ${AABB_IMAGENS:-jadsonmd}/aabb-postgres:${AABB_VERSAO:-latest}
    container_name: aabb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_POSTGRES_PASSWORD:?defina EVOLUTION_POSTGRES_PASSWORD no .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?defina KEYCLOAK_DB_PASSWORD no .env}
    volumes:
      - aabb-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aabb-network

  aabb-evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: aabb-evolution-api
    restart: unless-stopped
    depends_on:
      aabb-postgres:
        condition: service_healthy
    # Publicada só no loopback do host, para conectar o chip (QR code) e administrar a instância.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://aabb-evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      CONFIG_SESSION_PHONE_CLIENT: AABB Bot
      CONFIG_SESSION_PHONE_NAME: Chrome
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@aabb-postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: aabb
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Webhook global: toda instância envia as mensagens recebidas para o backend.
      # Só MESSAGES_UPSERT é necessário: ele traz comandos e reações do VAR.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://aabb-backend:8080/api/whatsapp/webhook
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_EDITED: "false"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE_UPDATE: "false"
      WEBHOOK_EVENTS_CONTACTS_SET: "false"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "false"
      WEBHOOK_EVENTS_CONTACTS_UPDATE: "false"
      WEBHOOK_EVENTS_PRESENCE_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_SET: "false"
      WEBHOOK_EVENTS_CHATS_UPSERT: "false"
      WEBHOOK_EVENTS_CHATS_UPDATE: "false"
      WEBHOOK_EVENTS_CHATS_DELETE: "false"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "false"
      WEBHOOK_EVENTS_GROUPS_UPDATE: "false"
      WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE: "false"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "false"
      WEBHOOK_EVENTS_LABELS_EDIT: "false"
      WEBHOOK_EVENTS_LABELS_ASSOCIATION: "false"
      WEBHOOK_EVENTS_CALL: "false"
    volumes:
      - aabb-evolution-instances:/evolution/instances
    networks:
      - aabb-network

  aabb-backend:
    build: ./aabb-backend
    image: ${AABB_IMAGENS:-jadsonmd}/aabb-backend:${AABB_VERSAO:-latest}
    container_name: aabb-backend
    restart: unless-stopped
    depends_on:
      aabb-mongodb:
        condition: service_healthy
    # Publicado só no loopback do host (diagnóstico). O painel acessa via proxy do aabb-frontend.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: America/Sao_Paulo
      AABB_MONGODB_URI: mongodb://aabb-mongodb:27017/aabb?replicaSet=rs0
      AABB_EVOLUTION_URL: http://aabb-evolution-api:8080
      AABB_EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      AABB_EVOLUTION_INSTANCIA: aabb-bot
      AABB_GRUPO_JID: ${AABB_GRUPO_JID:-}
      # Tokens do painel: chaves pela rede interna; "iss" é a URL pública que o navegador usa.
      AABB_KEYCLOAK_JWKS_URI: http://aabb-keycloak:8080/auth/realms/aabb/protocol/openid-connect/certs
      AABB_KEYCLOAK_ISSUER: ${AABB_URL_PUBLICA:-http://localhost:8088}/auth/realms/aabb
    networks:
      - aabb-network

  aabb-keycloak:
    build: ./infra/keycloak
    image: ${AABB_IMAGENS:-jadsonmd}/aabb-keycloak:${AABB_VERSAO:-latest}
    container_name: aabb-keycloak
    restart: unless-stopped
    depends_on:
      aabb-postgres:
        condition: service_healthy
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://aabb-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      # Servido pelo Nginx do aabb-frontend em <URL pública>/auth
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${AABB_URL_PUBLICA:-http://localhost:8088}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_SENHA:?defina KEYCLOAK_ADMIN_SENHA no .env}
      # Usados como placeholders no realm importado (infra/keycloak/aabb-realm.json)
      AABB_URL_PUBLICA: ${AABB_URL_PUBLICA:-http://localhost:8088}
      AABB_PAINEL_SENHA_INICIAL: ${AABB_PAINEL_SENHA_INICIAL:?defina AABB_PAINEL_SENHA_INICIAL no .env}
    networks:
      - aabb-network

  aabb-frontend:
    build: ./aabb-frontend
    image: ${AABB_IMAGENS:-jadsonmd}/aabb-frontend:${AABB_VERSAO:-latest}
    container_name: aabb-frontend
    restart: unless-stopped
    depends_on:
      - aabb-backend
      - aabb-keycloak
    # Única porta do sistema publicada para a rede (acesso externo via Tailscale ou Cloudflare Tunnel).
    ports:
      - "8088:80"
    networks:
      - aabb-network

volumes:
  aabb-mongodb-data:
  aabb-postgres-data:
  aabb-evolution-instances:

networks:
  aabb-network:
    name: aabb-network

# Painel AABB: arquivos do Angular + proxy para o backend (/api) e o Keycloak (/auth).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # DNS interno do Docker: resolve os serviços na hora da requisição (o Nginx sobe mesmo sem eles).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://aabb-backend:8080;
    set $keycloak http://aabb-keycloak:8080;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # O webhook só é chamado pela Evolution API dentro da rede interna.
    location ^~ /api/whatsapp/ {
        return 404;
    }

    location /api/ {
        proxy_pass $backend;
    }

    location /auth/ {
        proxy_pass $keycloak;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
